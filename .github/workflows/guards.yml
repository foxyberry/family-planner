name: Guards

# Runs on every push and PR: these checks are cheap (Linux runner, seconds).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets that reach a public repo are already leaked, so this is the second line of
  # defense; the first is the local pre-commit hook (.githooks/pre-commit).
  # The private-term list (.private-terms) is itself private, so that check runs locally only.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep findings out of public places: no SARIF artifact, no PR comments, no job
          # summary. A failing run still fails the check; read details locally with gitleaks.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  # Unit tests for the privacy guards themselves (they use fake terms only).
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the PR's base, for the checks that read only what the PR changes
      - name: Layout version citations this PR adds
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-layout-versions.sh --diff "origin/$BASE_REF" HEAD
      - name: Layout version check tests
        run: bash scripts/tests/check-layout-versions-test.sh
      - name: Private-term check tests
        run: bash scripts/tests/check-private-terms-test.sh
      - name: Claude hook tests
        run: bash scripts/tests/claude-hooks-test.sh
      - name: Pre-push hook tests
        run: bash scripts/tests/pre-push-test.sh
      - name: Crayon kit catalog test
        run: bash scripts/tests/kitart-catalog-test.sh
      - name: Kid screen check tests
        run: bash scripts/tests/check-kid-screens-test.sh
      - name: Dependency check tests
        run: bash scripts/tests/check-dependencies-test.sh
      - name: Crayon canvas check tests
        run: bash scripts/tests/check-crayon-canvas-test.sh
      - name: Debug boundary check tests
        run: bash scripts/tests/check-debug-boundary-test.sh
      - name: Layout literal check tests
        run: bash scripts/tests/check-layout-literals-test.sh
      - name: Strings check tests
        run: bash scripts/tests/check-strings-test.sh
      - name: View values check tests
        run: bash scripts/tests/check-view-values-test.sh
      - name: UX state check tests
        run: bash scripts/tests/ux-states-test.sh
      - name: Journey check tests
        run: bash scripts/tests/check-journeys-test.sh
      - name: Unattended tests check tests
        run: bash scripts/tests/check-unattended-tests-test.sh
      - name: Driver contract check tests
        run: bash scripts/tests/check-driver-contract-test.sh
      - name: Type name check tests
        run: bash scripts/tests/check-type-names-test.sh
      - name: Kit art check tests
        run: bash scripts/tests/check-kit-art-test.sh
      - name: Skills check tests
        run: bash scripts/tests/check-skills-test.sh
      - name: Lessons reminder tests
        run: bash scripts/tests/lessons-reminder-test.sh
      - name: Private data sync tests
        run: bash scripts/tests/private-sync-test.sh
      - name: Local status board tests
        run: bash scripts/tests/board-test.sh
      - name: Skill reference check tests
        run: bash scripts/tests/check-skill-refs-test.sh
      - name: Affected-test selection tests
        run: bash scripts/tests/test-affected-test.sh
      # The checks themselves, on this commit.
      - name: Repo checks (kid screens, dependencies, crayon canvas, debug boundary, layout literals, view values, journeys, unattended tests, driver contract, type names, kit art, strings, skills, skill refs)
        run: |
          bash scripts/check-kid-screens.sh
          bash scripts/check-dependencies.sh
          bash scripts/check-crayon-canvas.sh
          bash scripts/check-debug-boundary.sh
          bash scripts/check-layout-literals.sh
          bash scripts/check-view-values.sh
          bash scripts/check-journeys.sh
          bash scripts/check-unattended-tests.sh
          bash scripts/check-driver-contract.sh
          bash scripts/check-type-names.sh
          bash scripts/check-kit-art.sh
          bash scripts/check-strings.sh
          bash scripts/check-skills.sh
          bash scripts/check-skill-refs.sh
