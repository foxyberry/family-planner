name: Guards

# Runs on every push and PR: these checks are cheap (Linux runner, seconds).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets that reach a public repo are already leaked, so this is the second line of
  # defense; the first is the local pre-commit hook (.githooks/pre-commit).
  # The private-term list (.private-terms) is itself private, so that check runs locally only.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep findings out of public places: no SARIF artifact, no PR comments, no job
          # summary. A failing run still fails the check; read details locally with gitleaks.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  # Unit tests for the privacy guards themselves (they use fake terms only).
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Private-term check tests
        run: bash scripts/tests/check-private-terms-test.sh
      - name: Claude hook tests
        run: bash scripts/tests/claude-hooks-test.sh
      - name: Pre-push hook tests
        run: bash scripts/tests/pre-push-test.sh
      - name: Crayon kit catalog test
        run: bash scripts/tests/kitart-catalog-test.sh
      - name: Kid screen check tests
        run: bash scripts/tests/check-kid-screens-test.sh
      - name: Dependency check tests
        run: bash scripts/tests/check-dependencies-test.sh
      - name: Strings check tests
        run: bash scripts/tests/check-strings-test.sh
      - name: Skills check tests
        run: bash scripts/tests/check-skills-test.sh
      - name: Lessons reminder tests
        run: bash scripts/tests/lessons-reminder-test.sh
      - name: Private data sync tests
        run: bash scripts/tests/private-sync-test.sh
      # The checks themselves, on this commit.
      - name: Repo checks (kid screens, dependencies, strings, skills)
        run: |
          bash scripts/check-kid-screens.sh
          bash scripts/check-dependencies.sh
          bash scripts/check-strings.sh
          bash scripts/check-skills.sh
