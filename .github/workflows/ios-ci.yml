name: iOS CI

# Run only when something that affects the iOS build changes. Docs-only PRs skip this
# workflow, which matters because macOS runner minutes are the expensive ones.
on:
  push:
    branches: [main, develop]
    paths:
      - ios/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelrc
      - .bazelversion
      - Package.swift
      - Package.resolved
      - Makefile
      - project.bzl
      - BUILD.bazel
      - .github/workflows/ios-ci.yml
  pull_request:
    paths:
      - ios/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelrc
      - .bazelversion
      - Package.swift
      - Package.resolved
      - Makefile
      - project.bzl
      - BUILD.bazel
      - .github/workflows/ios-ci.yml
  # Manual re-run button (for example, to check how much the cache saves).
  workflow_dispatch:

# Read-only token: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-useless run.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    # A cold run compiles TCA and swift-syntax from scratch; cached runs are much faster.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Bazel's disk cache holds compiled outputs; the repository cache holds downloaded
      # dependencies. The key changes only when the lock files or Bazel version change,
      # so most runs restore a warm cache instead of recompiling everything.
      # Compiled outputs depend on the Xcode version too. Without it in the key, an Xcode
      # update on the runner image would keep restoring a cache that never hits again.
      - name: Xcode version for the cache key
        run: echo "XCODE_KEY=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Restore Bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-ios-${{ env.XCODE_KEY }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'Package.resolved') }}
          restore-keys: bazel-ios-${{ env.XCODE_KEY }}-

      # Pick an iPad simulator that this runner image actually has, instead of hard-coding
      # one that may not exist. Only the chosen device name and OS are printed.
      - name: Choose iPad simulator
        run: |
          xcodebuild -version
          read -r DEVICE OS < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPad Pro 13-inch"):
                      os = runtime.split("iOS-")[1].replace("-", ".")
                      print(d["name"].replace(" ", "_"), os)
                      sys.exit(0)
          sys.exit("no iPad Pro 13-inch simulator with iOS 26 on this runner")
          ')
          echo "SIM_DEVICE=${DEVICE//_/ }" >> "$GITHUB_ENV"
          echo "SIM_OS=$OS" >> "$GITHUB_ENV"
          echo "Using ${DEVICE//_/ } / iOS $OS"

      - name: Build
        run: make build

      # Test logs are printed only for failures (--test_output=errors in .bazelrc).
      # No artifacts are uploaded and no environment is printed: CI logs of a public
      # repo are public.
      - name: Test
        run: make test SIM_DEVICE="$SIM_DEVICE" SIM_OS="$SIM_OS"
