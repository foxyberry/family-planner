name: iOS CI

# Pushes to main/develop run only when something that affects the iOS build changes.
# Pull requests always start this workflow, because build-and-test is a required check on
# develop: a workflow skipped by a paths filter never reports, and the PR could never merge.
# The cheap `changes` job decides instead; when no iOS file changed, build-and-test is skipped
# (a skipped job satisfies a required check) and no macOS runner minutes are spent.
on:
  push:
    branches: [main, develop]
    paths:
      - ios/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelrc
      - .bazelversion
      - Package.swift
      - Package.resolved
      - Makefile
      - project.bzl
      - BUILD.bazel
      - .github/workflows/ios-ci.yml
      - .bazelignore
      - tools/crayon-art/**
  pull_request:
  # Manual re-run button (for example, to check how much the cache saves).
  workflow_dispatch:

# Read-only token: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-useless run.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same file list as the push filter above. Prints only true/false.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(ios/|tools/crayon-art/|MODULE\.bazel|\.bazelrc$|\.bazelversion$|\.bazelignore$|Package\.(swift|resolved)$|Makefile$|project\.bzl$|BUILD\.bazel$|\.github/workflows/ios-ci\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # A cold run compiles TCA and swift-syntax from scratch; cached runs are much faster.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Bazel's disk cache holds compiled outputs; the repository cache holds downloaded
      # dependencies. The key changes only when the lock files or Bazel version change,
      # so most runs restore a warm cache instead of recompiling everything.
      # Compiled outputs depend on the Xcode version too. Without it in the key, an Xcode
      # update on the runner image would keep restoring a cache that never hits again.
      - name: Xcode version for the cache key
        run: echo "XCODE_KEY=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      # Restore and save are separate steps so the build cache is saved even when a test fails;
      # a single red test must not send the next run back to a cold build.
      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-ios-${{ env.XCODE_KEY }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'Package.resolved') }}
          restore-keys: bazel-ios-${{ env.XCODE_KEY }}-

      # Pick an iPad simulator that this runner image actually has, instead of hard-coding
      # one that may not exist. Only the chosen device name and OS are printed.
      - name: Choose iPad simulator
        run: |
          xcodebuild -version
          read -r DEVICE OS < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPad Pro 13-inch"):
                      os = runtime.split("iOS-")[1].replace("-", ".")
                      print(d["name"].replace(" ", "_"), os)
                      sys.exit(0)
          sys.exit("no iPad Pro 13-inch simulator with iOS 26 on this runner")
          ')
          echo "SIM_DEVICE=${DEVICE//_/ }" >> "$GITHUB_ENV"
          echo "SIM_OS=$OS" >> "$GITHUB_ENV"
          echo "Using ${DEVICE//_/ } / iOS $OS"

      # CI builds without the git-ignored private school data, on purpose: PUBLIC_BUILD=1 passes
      # --config=public, which skips the "School data missing" check. Real builds never set it.
      - name: Build
        run: make build PUBLIC_BUILD=1

      # Test logs are printed only for failures (--test_output=errors in .bazelrc).
      # No artifacts are uploaded and no environment is printed: CI logs of a public
      # repo are public. Snapshot tests (tag "snapshot") are skipped here and by make test
      # while the designs keep changing; they run locally with make snapshots.
      - name: Test
        run: make test PUBLIC_BUILD=1 SIM_DEVICE="$SIM_DEVICE" SIM_OS="$SIM_OS"

      - name: Save Bazel caches
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
